services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-semeando}
      POSTGRES_USER: ${DB_USER:-semeando}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-semeando}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-semeando} -d ${DB_NAME:-semeando}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-semeando}
      DB_USER: ${DB_USER:-semeando}
      DB_PASSWORD: ${DB_PASSWORD:-semeando}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
