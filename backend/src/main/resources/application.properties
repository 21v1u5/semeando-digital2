server.port=8080

# Banco de dados: PostgreSQL (persistente). Valores sobrescritos por variaveis de
# ambiente em docker-compose; os defaults servem para rodar localmente com um
# Postgres em localhost:5432.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/semeando}
spring.datasource.username=${DB_USER:semeando}
spring.datasource.password=${DB_PASSWORD:semeando}

# "update": cria/evolui o schema e PRESERVA os dados entre reinicializacoes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Origens permitidas para o front-end (CORS). Em producao, o dominio publico.
app.cors-origins=${APP_CORS_ORIGINS:http://localhost:5173}
