# Profile opcional "h2": banco em memoria, sem precisar de PostgreSQL.
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Atencao: os dados sao recriados a cada inicializacao (nao ha persistencia).
spring.datasource.url=jdbc:h2:mem:semeando;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
# As migrations do Flyway sao especificas de PostgreSQL; no profile H2 o schema
# e criado pelo Hibernate (create-drop), entao o Flyway fica desligado.
spring.flyway.enabled=false
