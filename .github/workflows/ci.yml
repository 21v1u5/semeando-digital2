name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Testes do backend (JUnit + integração)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: semeando
          POSTGRES_USER: semeando
          POSTGRES_PASSWORD: semeando
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semeando"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Rodar testes (unitários + integração com Postgres)
        working-directory: backend
        run: mvn -B test

  frontend-build:
    name: Build do frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar e buildar
        working-directory: frontend
        run: |
          npm ci
          npm run build
